agent-default-model:
  provider: agw
  model: auto
  reasoningEffort: low
llm-pi-ai:
  providers:
    agw:
      displayName: AGW Gateway
      api: anthropic-messages
      apiKeyEnv: GATEWAY_MANAGED_KEY
      baseURL: https://agw.playground.straitsx.ai/kiro/anthropic
      defaultInput:
        - text
        - image
      models:
        - id: auto
          name: Auto
          contextWindow: 1000000
          maxTokens: 128000
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            max: max
